<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- BACKGROUND HERO — MI Ihyaul Islam
       File ini murni SVG (bukan foto), jadi beratnya kecil dan
       tetap tampil walau laptop tidak tersambung internet. -->

  <defs>
    <!-- Gradasi dasar: biru tua -> biru malam -> tosca gelap -->
    <linearGradient id="latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>

    <!-- Pola bintang 8 (khas islami) berulang, garis tipis transparan -->
    <pattern id="pola-bintang" width="130" height="130" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2">
        <rect x="35" y="35" width="60" height="60"/>
        <rect x="35" y="35" width="60" height="60" transform="rotate(45 65 65)"/>
        <circle cx="65" cy="65" r="7"/>
        <circle cx="0" cy="0" r="4"/>
        <circle cx="130" cy="130" r="4"/>
      </g>
    </pattern>
  </defs>

  <!-- Lapisan 1 : gradasi -->
  <rect width="1600" height="900" fill="url(#latar)"/>

  <!-- Lapisan 2 : pola bintang -->
  <rect width="1600" height="900" fill="url(#pola-bintang)"/>

  <!-- Lapisan 3 : cahaya lembut agar tidak flat -->
  <circle cx="180" cy="120" r="260" fill="#3b82f6" fill-opacity="0.20"/>
  <circle cx="1450" cy="780" r="300" fill="#16a34a" fill-opacity="0.13"/>
  <circle cx="1300" cy="120" r="140" fill="#fde047" fill-opacity="0.07"/>
</svg>
